services:
  sefirah-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI}

    expose:
      - "3000"

    env_file:
      - .env.local

    restart: unless-stopped

  sefirah-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI}

    expose:
      - "3000"

    env_file:
      - .env.local

    restart: unless-stopped

  sefirah-3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI}

    expose:
      - "3000"

    env_file:
      - .env.local

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - sefirah-1
      - sefirah-2
      - sefirah-3

    restart: unless-stopped